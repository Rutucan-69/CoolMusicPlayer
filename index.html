<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player - DM Mono Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN TOKENS --- */
        :root {
            --bg-color: #141414;
            --box-bg: #1a1a1a;
            --border-color: #4c4a4e;
            --accent-color: #b589d6; 
            --text-color: #4c4c4c;
            --font-main: 'DM Mono', monospace;
            
            --sidebar-width: 25%;
            --middle-width: 71.5%;
            --control-height: 10vh; 
            --control-bottom: 1.5vh;
            --top-bar-height: 5vh;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: var(--font-main);
        }

        .my-box {
            width: 100%;
            height: 100%;
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            position: relative; 
            box-sizing: border-box;
        }

        /* --- SHARED BOX HOVER EFFECT --- */
        .inner-box2, .inner-box3, .inner-box-middle, .inner-box4, .equalizer-container {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .inner-box2:hover, .inner-box3:hover, .inner-box-middle:hover, .inner-box4:hover, .equalizer-container:hover {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 10px rgba(181, 137, 214, 0.1);
        }

        /* Top Bar */
        .inner-box2 {
            width: 98%; 
            height: var(--top-bar-height);
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            position: absolute;
            top: 1%; left: 1%;  
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        #now-playing-display {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-color);
            font-size: 1.3vh;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
            pointer-events: none;
        }

        .window-controls { display: flex; height: 100%; }
        .win-btn {
            width: 45px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.5vh;
            transition: all 0.2s ease;
        }
        .win-btn:hover { background-color: rgba(181, 137, 214, 0.1); color: #ffffff; }
        .close-btn:hover { background-color: #ff4d4d; color: white; }

        /* Sidebar */
        .inner-box3 {
            width: var(--sidebar-width);
            height: 78%; 
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            position: absolute;
            top: 8%; left: 1%;  
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5% 0;
            gap: 1.5vh;
        }

        .album-cover-container {
            width: 85%;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border-color);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* UPDATED: Background matches sidebar grey */
        .equalizer-container {
            width: 85%;
            height: 12vh;
            border: 2px solid var(--border-color);
            background-color: var(--box-bg); 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #visualizer { width: 100%; height: 100%; }
        #album-art { width: 100%; height: 100%; object-fit: cover; display: none; }
        .no-art-placeholder { color: var(--text-color); font-size: 1.2vh; text-align: center; }
        
        /* Music List */
        .inner-box-middle {
            width: var(--middle-width);
            height: 78%;
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            position: absolute;
            top: 8%; left: 27.5%;
            overflow-y: auto;
            padding: 1%;
        }

        /* Controls */
        .inner-box4 {
            width: 98%;
            height: var(--control-height);
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            position: absolute;
            bottom: var(--control-bottom); 
            left: 1%;
            display: flex;
            align-items: center;
            padding: 0 2%;
            gap: 2%;
        }

        .icon-btn {
            background: none;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            border-radius: 5px;
        }

        .icon-btn:hover { border-color: var(--accent-color); transform: scale(1.1); }
        .control-img { height: 3vh; width: auto; }
        .play-img { height: 5vh; width: auto; }

        .music-item {
            padding: 2%;
            border-bottom: 1px solid #333;
            border-left: 2px solid transparent;
            cursor: pointer;
            font-size: 1.4vh;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-item:hover { color: #ffffff; background-color: rgba(181, 137, 214, 0.05); }
        .music-item.active { color: var(--accent-color); border-left: 2px solid var(--accent-color); }

        input[type="range"] { -webkit-appearance: none; background: #4c4a4e; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; background: #ffffff; border-radius: 50%; cursor: pointer; }

        #seek-slider { flex-grow: 1; height: 0.6vh; }
        .volume-container { display: flex; align-items: center; gap: 0.5vh; width: 15%; }
        #volume-slider { width: 100%; height: 0.5vh; }

        .select-btn {
            background-color: #1a1a1a;
            color: #4c4a4e;
            border: 2px solid #4c4a4e;
            padding: 3% 5%;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 1.8vh; 
            width: 90%;
            transition: all 0.2s ease;
            text-transform: uppercase;
            margin-top: auto;
            margin-bottom: 10px;
        }
        .select-btn:hover { border-color: var(--accent-color); color: #ffffff; }
        #current-time, .volume-icon { font-size: 1.2vh; color: var(--text-color); }
    </style>
</head>
<body>

    <div class="my-box">
        <div class="inner-box2">
            <div id="now-playing-display">Now Playing - None</div>
            <div class="window-controls">
                <div class="win-btn">─</div>
                <div class="win-btn">▢</div>
                <div class="win-btn close-btn">✕</div>
            </div>
        </div>

        <div class="inner-box3">
            <div class="album-cover-container">
                <img id="album-art" src="" alt="Album Art">
                <div class="no-art-placeholder" id="placeholder-text">NO COVER ART</div>
            </div>

            <div class="equalizer-container">
                <canvas id="visualizer"></canvas>
            </div>

            <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;">
            <button class="select-btn" onclick="document.getElementById('folder-input').click()">Select Folder</button>
        </div>
        
        <div class="inner-box-middle" id="music-list"></div>

        <div class="inner-box4">
            <audio id="main-audio" crossorigin="anonymous"></audio>
            
            <div class="player-controls" style="display: flex; align-items: center; gap: 10px;">
                <button id="shuffle-btn" class="icon-btn"><img id="shuffle-icon" src="shuffle_off.png" class="control-img" alt="Shuffle"></button>
                <button id="prev-btn" class="icon-btn"><img src="back.png" class="control-img" alt="Back"></button>
                <button id="play-btn" class="icon-btn"><img id="play-icon" src="play.png" class="play-img" alt="Play"></button>
                <button id="next-btn" class="icon-btn"><img src="forward.png" class="control-img" alt="Forward"></button>
            </div>

            <input type="range" id="seek-slider" value="0" max="100">
            <span id="current-time" style="min-width: 45px;">0:00</span>
            
            <div class="volume-container">
                <span class="volume-icon">VOL</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>    
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <script>
        const IMAGES = { play: "play.png", pause: "pause.png", shuffleOn: "shuffle_on.png", shuffleOff: "shuffle_off.png" };
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const shuffleIcon = document.getElementById('shuffle-icon');
        const seekSlider = document.getElementById('seek-slider');
        const volumeSlider = document.getElementById('volume-slider');
        const currentTime = document.getElementById('current-time');
        const folderInput = document.getElementById('folder-input');
        const musicList = document.getElementById('music-list');
        const albumArt = document.getElementById('album-art');
        const placeholderText = document.getElementById('placeholder-text');
        const nowPlayingDisplay = document.getElementById('now-playing-display');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        let playlist = [];
        let currentIndex = -1;
        let isShuffle = false;
        let audioCtx, analyser, source;

        function setupVisualizer() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64; 
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                // UPDATED: Canvas background matches the grey sidebar (#1a1a1a)
                canvasCtx.fillStyle = '#1a1a1a';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / bufferLength) * 2;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;
                    canvasCtx.fillStyle = '#b589d6';
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                    x += barWidth;
                }
            }
            draw();
        }

        folderInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            playlist = files.filter(f => f.type.includes('audio') || f.name.endsWith('.mp3'));
            musicList.innerHTML = ''; 
            playlist.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'music-item';
                item.textContent = file.name;
                item.addEventListener('click', () => playSong(index));
                musicList.appendChild(item);
            });
        });

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            setupVisualizer(); 
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const items = document.querySelectorAll('.music-item');
            items.forEach(el => el.classList.remove('active'));
            if(items[index]) items[index].classList.add('active');
            
            currentIndex = index;
            const file = playlist[currentIndex];
            nowPlayingDisplay.textContent = `Now Playing - ${file.name}`;
            audio.src = URL.createObjectURL(file);
            audio.play();
            playIcon.src = IMAGES.pause;
            loadAlbumArt(file);
        }

        function loadAlbumArt(file) {
            jsmediatags.read(file, {
                onSuccess: function(tag) {
                    const data = tag.tags.picture;
                    if (data) {
                        let base64String = "";
                        for (let i = 0; i < data.data.length; i++) base64String += String.fromCharCode(data.data[i]);
                        albumArt.src = `data:${data.format};base64,${window.btoa(base64String)}`;
                        albumArt.style.display = 'block';
                        placeholderText.style.display = 'none';
                    } else { showNoArt(); }
                },
                onError: function() { showNoArt(); }
            });
        }

        function showNoArt() {
            albumArt.style.display = 'none';
            placeholderText.style.display = 'block';
        }

        playBtn.addEventListener('click', () => {
            if (!audio.src && playlist.length > 0) playSong(0);
            if (audioCtx) audioCtx.resume();
            if (audio.paused) { audio.play(); playIcon.src = IMAGES.pause; } 
            else { audio.pause(); playIcon.src = IMAGES.play; }
        });

        nextBtn.addEventListener('click', () => {
            let nextIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : currentIndex + 1;
            if (nextIndex >= playlist.length) nextIndex = 0;
            playSong(nextIndex);
        });

        prevBtn.addEventListener('click', () => {
            let prevIndex = currentIndex - 1;
            if (prevIndex < 0) prevIndex = playlist.length - 1;
            playSong(prevIndex);
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleIcon.src = isShuffle ? IMAGES.shuffleOn : IMAGES.shuffleOff;
        });

        audio.onended = () => nextBtn.click();

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = percentage;
                seekSlider.style.background = `linear-gradient(to right, #b589d6 ${percentage}%, #4c4a4e ${percentage}%)`;
                let mins = Math.floor(audio.currentTime / 60);
                let secs = Math.floor(audio.currentTime % 60);
                currentTime.textContent = `${mins}:${secs < 10 ? '0' + secs : secs}`;
            }
        });

        seekSlider.addEventListener('input', () => {
            audio.currentTime = audio.duration * (seekSlider.value / 100);
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            volumeSlider.style.background = `linear-gradient(to right, #b589d6 ${e.target.value * 100}%, #4c4a4e ${e.target.value * 100}%)`;
        });
    </script>
</body>
</html>
